<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0a">
  <title>QF Launchpad (devnet)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./launchpad.css">
</head>
<body>
  <div id="netbar" role="note"><span class="pill">DEVNET</span> <span id="netnote">Test network. Nothing here has value.</span></div>
  <header class="top">
    <a class="brand" href="#/" aria-label="QF launchpad home">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="10" fill="#c8f560"/><path d="M8 25 C 14 25, 17 21, 19 15 S 23 9, 26 9" stroke="#0a0b0a" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="9" r="2.6" fill="#0a0b0a"/></svg>
      <b>QF</b>
    </a>
    <nav><a href="#/">Explore</a><a href="#/create">Create</a><a href="#/fees">Fees</a><a href="#/earnings">Earnings</a><a href="#/status">Status</a></nav>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, ticker or mint" aria-label="Search coins" autocomplete="off">
    </label>
    <div id="wallet"></div>
  </header>
  <div id="tape" hidden aria-label="Latest trades"></div>
  <main id="view"></main>
  <footer class="foot">Meteora Dynamic Bonding Curve to DAMM v2 · devnet build · transactions are built by the server, checked in your browser and signed only in your wallet</footer>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="./launchpad.js"></script>
</body>
</html>
